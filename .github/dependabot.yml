# N2: Dependabot config para mantener deps al día sin esfuerzo manual.
#
# Frecuencia: semanal. Diario sería ruido — pocas deps cambian.
# Agrupamos: minor + patch updates en un solo PR por week (típicamente
# 5-15 deps); major updates van en PR separados porque suelen requerir
# atención manual (breaking changes en migración React/Vite, etc.).
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: 'America/Argentina/Buenos_Aires'
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # Los formateadores y linters van aparte. Una versión nueva de Prettier
      # reformatea archivos y tumba `format:check`; si viaja en el mismo PR que
      # 17 parches, se los lleva por delante (agosto de 2026: tres lunes seguidos
      # en rojo por Prettier 3.8 → 3.9 y ninguna actualización menor entró).
      tooling:
        patterns:
          - 'prettier'
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - 'knip'
          - 'dependency-cruiser'
      # Minor + patch en un solo PR para evitar inbox flood.
      minor-and-patch:
        update-types:
          - minor
          - patch
        # Excluir majors críticos que merecen PR aparte aunque sean minor,
        # y el tooling, que ya tiene su grupo.
        exclude-patterns:
          - 'react'
          - 'react-dom'
          - 'vite'
          - '@netlify/*'
          - '@clerk/*'
          - 'prettier'
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - 'knip'
          - 'dependency-cruiser'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - ci
