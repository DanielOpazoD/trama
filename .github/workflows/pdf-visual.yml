name: pdf-visual

# Estas capturas son de macOS (ver el encabezado de e2e/pdf-studio-visual.spec.ts),
# así que no pueden vivir en los jobs ubuntu de test.yml. Corren acá:
#
#   - pull_request + paths: los PR que tocan el editor de PDF o las piezas
#     compartidas que dibuja la barra pagan un runner macOS y se enteran en el
#     acto. Antes sólo había schedule y workflow_dispatch: #257 sumó «Firma y
#     timbre» a la barra, nadie refrescó las capturas y la deriva vivió seis
#     semanas en main sin que ningún check de PR se pusiera rojo.
#   - schedule: red de seguridad. Ninguna lista de `paths` adivina todo lo que
#     mueve un píxel (un token de Tailwind, un hook compartido, el propio
#     Chromium), así que la corrida semanal sigue cubriendo el resto.
on:
  # No es check requerido, pero si el repo se muda a una organización y entra
  # al merge queue, conviene que ya escuche el evento.
  merge_group:
    branches: [main]
  pull_request:
    paths:
      - 'src/components/notas/pdfStudio/**'
      - 'src/components/IconButton.tsx'
      - 'src/components/Icons.tsx'
      - 'src/components/OverflowMenu.tsx'
      - 'src/components/Tooltip.tsx'
      - 'src/index.css'
      - 'tailwind.config.js'
      - 'e2e/fixtures.ts'
      - 'e2e/pdf-studio-visual.spec.ts'
      - 'e2e/pdf-studio-visual.spec.ts-snapshots/**'
      - 'e2e/focus-ring-visual.spec.ts'
      - 'e2e/focus-ring-visual.spec.ts-snapshots/**'
      - '.github/workflows/pdf-visual.yml'
  workflow_dispatch:
  schedule:
    # Martes temprano UTC: cadencia semanal fuera del camino crítico de PR.
    - cron: '17 7 * * 2'

jobs:
  pdf-visual:
    runs-on: macos-latest
    env:
      PDF_STUDIO_VISUAL: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        run: node_modules/.bin/playwright install chromium

      - name: Run PDF visual snapshots
        run: npm run e2e:pdf-visual

      # El anillo de foco tenía script, baselines commiteadas y hasta una línea
      # en design.md… y no lo corría ningún workflow. Un gate que existe en el
      # papel y no en la práctica: cuando #391 subió el botón de herramienta de
      # 30×28 a 32×32 la baseline quedó podrida, y no se supo hasta ejecutarlo a
      # mano meses después. Va acá porque comparte runner macOS y captura la
      # misma barra del editor. `always()` para que un fallo del snapshot de
      # arriba no lo deje sin correr: son dos señales distintas.
      - name: Run focus-ring visual snapshots
        if: always()
        run: npm run e2e:focus-visual

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pdf-visual-playwright-report
          path: playwright-report/
          retention-days: 14
