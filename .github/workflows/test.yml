name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'codex/trama-pr*']
  workflow_dispatch:
    inputs:
      run_standard_ci:
        description: 'Correr lint/unit/e2e/secrets/migrations además del smoke manual'
        required: false
        type: boolean
        default: false
      run_multiuser_smoke:
        description: 'Correr smoke real multiusuario con usuarios Clerk A/B'
        required: false
        type: boolean
        default: true
      base_url:
        description: 'URL real a probar (si queda vacio usa vars.E2E_BASE_URL)'
        required: false
        type: string

# R1: el workflow se dividió en jobs paralelos:
#
#   lint       → eslint + prettier check
#   unit       → typecheck + vitest + coverage + build + bundle-size + audit
#   e2e        → Playwright + axe-core a11y
#   secrets    → gitleaks (D4): escaneo de secretos sobre todo el historial
#   migrations → G1/K3: aplica las migraciones versionadas sobre un Postgres pgvector
#                efímero — gate de drift/SQL antes del deploy a Neon
#
# Los jobs node (lint/unit/e2e) comparten install + cache de npm; secrets y
# migrations no usan node. Todos corren en runners distintos en simultáneo.
# Antes el workflow era un solo job secuencial de ~5min; ahora el critical
# path está cerca de los ~3min (limitado por el e2e que es el más lento).

jobs:
  lint:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_standard_ci }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # N1: lint + format check.
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Documentation drift check
        run: npm run check:docs-drift

      # Gate de soft-delete: bloquea `DELETE FROM` nuevos fuera del allowlist
      # (los hard-deletes legítimos están enumerados en el script). Antes el
      # script existía pero no corría en ningún job.
      - name: Hard-delete allowlist check
        run: npm run check:hard-delete-allowlist

      # Gate de migraciones: prefijos de timestamp duplicados rompen el orden de
      # aplicación y ya tumbaron un deploy. Check estático (sin DB), corre acá
      # en el job de lint que sí tiene node (el job `migrations` no lo usa).
      - name: Migration duplicate-prefix check
        run: npm run check:migration-duplicates

  unit:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_standard_ci }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # N8: coverage con thresholds calibrados al baseline. Falla si
      # baja del piso (ver vitest.config.ts).
      - name: Coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Build
        run: npm run build

      # N8: npm audit (warn-only). Falla solo en CRITICAL.
      - name: Security audit (production deps)
        run: npm audit --omit=dev --audit-level=critical
        continue-on-error: true

      # G4: bundle-size budget. Falla si un chunk crece más de su tope.
      - name: Bundle size budget
        run: node scripts/check-bundle-size.mjs

  e2e:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_standard_ci }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Playwright browsers no van en npm ci (~100MB). Los instalamos
      # solo en este job, no en lint/unit.
      - name: Install Playwright browsers
        run: npm run e2e:install

      - name: Run E2E tests
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  multiuser-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_multiuser_smoke }}
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: ${{ inputs.base_url || vars.E2E_BASE_URL }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      E2E_USER_A_ID: ${{ secrets.E2E_USER_A_ID }}
      E2E_USER_B_ID: ${{ secrets.E2E_USER_B_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check required multiuser smoke config
        run: |
          missing=0
          for key in E2E_BASE_URL CLERK_SECRET_KEY E2E_USER_A_ID E2E_USER_B_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Falta $key para correr el smoke multiusuario real"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run real multiuser smoke
        run: npm run e2e:multiuser -- --project=chromium

  # D4: secret scanning. gitleaks escanea TODO el historial de git
  # (fetch-depth: 0) contra el ruleset por defecto + la allowlist de
  # .gitleaks.toml. Si encuentra una clave commiteada, falla el merge.
  # Bajamos un binario pinneado en vez de la action oficial para evitar
  # el chequeo de licencia de org y mantener el job determinístico.
  secrets:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_standard_ci }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.18.4
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for secrets
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose

  # G1/K3: gate de migraciones. Levanta un Postgres efímero con pgvector y
  # corre scripts/apply-migrations.sh sobre una DB limpia. Hasta ahora el
  # drift de schema y los errores de SQL (orden, dependencias, extensiones)
  # sólo aparecían durante el deploy a Neon; este job los detecta en el PR.
  # Usa la MISMA imagen que docker-compose.yml (pgvector/pgvector:pg16) para
  # que "pasa en CI" implique "anda con db:up local".
  migrations:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_standard_ci }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: trama
          POSTGRES_PASSWORD: trama_local_dev
          POSTGRES_DB: trama
        # Mapeo igual al de docker-compose: host 5433 → contenedor 5432, así
        # el DATABASE_URL por defecto del script (localhost:5433) matchea.
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U trama -d trama"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      # ubuntu-latest ya trae el cliente psql; lo verificamos explícito para
      # que un eventual "command not found" sea legible en el log.
      - name: Check psql client
        run: psql --version

      # Fresh apply = el gate. Si una migración no aplica sobre una DB limpia
      # (sintaxis, orden, extensión faltante), el job falla acá.
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://trama:trama_local_dev@localhost:5433/trama
        run: scripts/apply-migrations.sh

      # Idempotencia: re-correr no debe aplicar ninguna migración nueva
      # (todas quedaron registradas en _migrations). Esto valida que el
      # tracking incremental — el mismo modelo que usa Netlify — funciona.
      - name: Re-apply is a no-op (idempotency)
        env:
          DATABASE_URL: postgresql://trama:trama_local_dev@localhost:5433/trama
        run: |
          out=$(scripts/apply-migrations.sh)
          echo "$out"
          echo "$out" | grep -q "Applied 0 new migration(s)." || {
            echo "::error::Re-run aplicó migraciones de nuevo — el tracking en _migrations está roto"
            exit 1
          }

      # Regresión de los CTE atómicos de los handlers (entities-merge, cascade
      # DELETE/restore, momento POST) contra Postgres real. Corre sobre una DB
      # throwaway recién creada — el SQL crea sus propias tablas, así que NO debe
      # tocar la DB migrada `trama`.
      - name: CTE atomicity regression
        env:
          PGPASSWORD: trama_local_dev
        run: |
          createdb -h localhost -p 5433 -U trama cte_regression
          DATABASE_URL=postgresql://trama:trama_local_dev@localhost:5433/cte_regression \
            npm run check:cte-regression
