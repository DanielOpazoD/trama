name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # N1: lint + format check. Fallan si cualquier archivo no pasa
      # eslint.config.js o si Prettier propondría cambios. El pre-commit
      # de Husky corre los mismos checks localmente para que CI no
      # encuentre sorpresas.
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # N8: corre coverage en CI para verificar thresholds (definidos en
      # vitest.config.ts). Sube el reporte HTML como artifact para que el
      # PR pueda descargarlo y mirar archivos sin cobertura.
      - name: Coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Build
        run: npm run build

      # N8: npm audit en CI (warn-only). Falla solo si hay CRITICAL CVEs;
      # high/moderate se reportan pero no bloquean. Esto da visibilidad
      # sin romper PRs por advisories transitivos que no podemos arreglar
      # nosotros.
      - name: Security audit (production deps)
        run: npm audit --omit=dev --audit-level=critical
        continue-on-error: true

      # G4: bundle-size budget. Falla si un chunk crece más de su tope (gzip).
      # Los budgets viven en scripts/check-bundle-size.mjs — subirlos requiere
      # justificación, no es un "que pase CI".
      - name: Bundle size budget
        run: node scripts/check-bundle-size.mjs

      # E2E: Playwright + chromium. Browser binaries no van en npm ci
      # (cuesta ~100MB), se instalan acá. Los tests usan mock fixtures;
      # no requieren backend real ni Neon.
      - name: Install Playwright browsers
        run: npm run e2e:install

      - name: Run E2E tests
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
