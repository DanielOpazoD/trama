name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'codex/trama-pr*']

# R1: el workflow se dividió en jobs paralelos:
#
#   lint       → eslint + prettier check
#   unit       → typecheck + vitest + coverage + build + bundle-size + audit
#   e2e        → Playwright + axe-core a11y
#   secrets    → gitleaks (D4): escaneo de secretos sobre todo el historial
#   migrations → G1/K3: aplica las migraciones versionadas sobre un Postgres pgvector
#                efímero — gate de drift/SQL antes del deploy a Neon
#
# Los jobs node (lint/unit/e2e) comparten install + cache de npm; secrets y
# migrations no usan node. Todos corren en runners distintos en simultáneo.
# Antes el workflow era un solo job secuencial de ~5min; ahora el critical
# path está cerca de los ~3min (limitado por el e2e que es el más lento).

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # N1: lint + format check.
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # La cadena de suministro no la miraba nadie hasta agosto de 2026: se
      # habían acumulado doce avisos, y uno era ejecución arbitraria de
      # JavaScript al abrir un PDF, en una app que abre PDFs. Ahora un aviso
      # alto nuevo frena el merge salvo que esté aceptado por escrito.
      - name: Dependency advisories check
        run: npm run check:deps-advisories

      - name: Documentation drift check
        run: npm run check:docs-drift

      - name: Pending register check
        run: npm run check:pendientes

      # El mapa de arquitectura cita ~200 archivos reales: si un PR renombra o
      # borra alguno, el mapa pasa a mentir y este gate lo dice acá y no dentro
      # de seis meses. También verifica que el HTML no quede con una copia
      # vieja del grafo.
      - name: Architecture map check
        run: npm run check:architecture-map

      - name: Operational scripts registry check
        run: npm run check:script-registry

      - name: Mock completeness check
        run: npm run check:mock-completeness

      - name: Dead-code inventory check
        run: npm run check:knip

      - name: Architecture boundaries check
        run: npm run check:architecture

      # Guard de cutover multiusuario: producción nunca puede deployar sin Clerk
      # completo ni con ALLOW_LEGACY_FALLBACK=true. Netlify lo corre en build;
      # PR también debe bloquearlo antes de llegar a deploy.
      - name: Legacy fallback production guard
        run: npm run check:legacy-fallback

      # Inventario ejecutable de privacidad: tablas con user_id, RLS esperado,
      # matriz endpoint→auth→ownership→operación y dominios cubiertos por el
      # smoke multiusuario productivo. Bloquea drift antes de que llegue al PR.
      - name: Auth/RLS contracts inventory
        run: npm run check:auth-rls-contracts

      # El tenant legacy queda solo como compatibilidad historica: ninguna tabla
      # privada debe conservar user_id DEFAULT 'legacy-single-user'. Si un INSERT
      # nuevo olvida user_id, debe fallar fuerte en la DB.
      - name: Legacy identity cutover contracts
        run: npm run check:legacy-identity-contracts

      # Ningún INSERT productivo a tablas privadas puede depender del default
      # legacy: user_id debe estar presente en la lista de columnas.
      - name: User id write contracts
        run: npm run check:user-id-writes

      - name: Legacy identity report
        run: npm run legacy-identity:report > legacy-identity-report.md

      - name: Upload legacy identity report
        uses: actions/upload-artifact@v7
        with:
          name: legacy-identity-report
          path: legacy-identity-report.md
          retention-days: 14

      # Contrato runtime de rutas: los wrappers pueden delegar handler a _lib,
      # pero config.path vive en netlify/functions/*.mts para que Netlify monte
      # /api/* de forma verificable antes de deployar.
      - name: Runtime API routes contract
        run: npm run check:runtime-api-routes

      # Contrato de request parsing: superficies privadas de alto riesgo deben
      # validar method/query/form-data con helpers compartidos antes de SQL,
      # blobs o LLM. Evita volver a parsing manual disperso en cada handler.
      - name: API request contracts
        run: npm run check:api-request-contracts
      - name: API error shape
        run: npm run check:api-error-shape

      # Contrato de servicios de dominio backend: los handlers de alto riesgo
      # pueden orquestar auth/SQL/respuesta, pero los mappers/drafts/planes
      # puros deben vivir en servicios testeables para no volver a handlers
      # monolíticos.
      - name: Backend domain services contract
        run: npm run check:backend-domain-services

      # Contrato runtime de rows calientes: SELECT/RETURNING de entities,
      # quotes, notes, momentos y search deben estar envueltos en parseRows
      # con schema y contexto, salvo rows operacionales pequeñas allowlisteadas.
      - name: Row runtime contracts
        run: npm run check:row-runtime-contracts

      # Contrato operacional multiusuario: vocabulario de eventos, redacción,
      # health productivo y smoke reportable deben quedar documentados y
      # conectados a auth/wrapper antes de mergear.
      - name: Operational observability contracts
        run: npm run check:operational-observability

      # Frontera de storage: el cliente y los handlers no deben importar
      # @netlify/blobs directo. El adapter centraliza provider actual
      # (Netlify Blobs) y deja preparada una migración futura.
      - name: Storage boundaries contract
        run: npm run check:storage-boundaries

      # Gate de soft-delete: bloquea `DELETE FROM` nuevos fuera del allowlist
      # (los hard-deletes legítimos están enumerados en el script). Antes el
      # script existía pero no corría en ningún job.
      - name: Hard-delete allowlist check
        run: npm run check:hard-delete-allowlist

      # Gate de migraciones: prefijos de timestamp duplicados rompen el orden de
      # aplicación y ya tumbaron un deploy. Check estático (sin DB), corre acá
      # en el job de lint que sí tiene node (el job `migrations` no lo usa).
      - name: Migration duplicate-prefix check
        run: npm run check:migration-duplicates

      - name: Structure ratchets check
        run: npm run check:structure-ratchets

      - name: Frontend boundaries check
        run: npm run check:frontend-boundaries

      - name: Design tokens ratchet check
        run: npm run check:design-tokens

      - name: Modal overlay adoption check
        run: npm run check:modal-overlay

      - name: Form control labels check
        run: npm run check:form-control-labels

      - name: IconButton adoption check
        run: npm run check:icon-button

      - name: Focus-ring convention check
        run: npm run check:focus-ring

      - name: PDF runtime boundaries check
        run: npm run check:pdf-runtime-boundaries

      - name: Client API contracts check
        run: npm run check:client-api-contracts

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # N8: coverage con thresholds calibrados al baseline. Falla si
      # baja del piso (ver vitest.config.ts).
      - name: Coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Build
        run: npm run build

      # N8: npm audit (warn-only). Falla solo en CRITICAL.
      - name: Security audit (production deps)
        run: npm audit --omit=dev --audit-level=critical
        continue-on-error: true

      # G4: bundle-size budget. Falla si un chunk crece más de su tope.
      - name: Bundle size budget
        run: node scripts/check-bundle-size.mjs

      # PDF Studio debe seguir lazy: el shell inicial no puede pre-cargar
      # pdf-lib, pdf.js, OCR ni workers PDF por accidente.
      - name: PDF lazy entrypoints check
        run: npm run check:pdf-lazy-entrypoints

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Playwright browsers no van en npm ci (~100MB). Los instalamos
      # solo en este job, no en lint/unit.
      - name: Install Playwright browsers
        run: npm run e2e:install

      - name: Run E2E tests
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # D4: secret scanning. gitleaks escanea TODO el historial de git
  # (fetch-depth: 0) contra el ruleset por defecto + la allowlist de
  # .gitleaks.toml. Si encuentra una clave commiteada, falla el merge.
  # Bajamos un binario pinneado en vez de la action oficial para evitar
  # el chequeo de licencia de org y mantener el job determinístico.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.18.4
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for secrets
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose

  # G1/K3: gate de migraciones. Levanta un Postgres efímero con pgvector y
  # corre scripts/apply-migrations.sh sobre una DB limpia. Hasta ahora el
  # drift de schema y los errores de SQL (orden, dependencias, extensiones)
  # sólo aparecían durante el deploy a Neon; este job los detecta en el PR.
  # Usa la MISMA imagen que docker-compose.yml (pgvector/pgvector:pg16) para
  # que "pasa en CI" implique "anda con db:up local".
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: trama
          POSTGRES_PASSWORD: trama_local_dev
          POSTGRES_DB: trama
        # Mapeo igual al de docker-compose: host 5433 → contenedor 5432, así
        # el DATABASE_URL por defecto del script (localhost:5433) matchea.
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U trama -d trama"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      # ubuntu-latest ya trae el cliente psql; lo verificamos explícito para
      # que un eventual "command not found" sea legible en el log.
      - name: Check psql client
        run: psql --version

      # Fresh apply = el gate. Si una migración no aplica sobre una DB limpia
      # (sintaxis, orden, extensión faltante), el job falla acá.
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://trama:trama_local_dev@localhost:5433/trama
        run: scripts/apply-migrations.sh

      # Contrato de esquema del puente WhatsApp: contra la DB recién migrada,
      # verifica que cada columna que el código de WhatsApp referencia exista.
      # Atrapa la clase de bug del PR #208 (columna usada pero nunca creada),
      # que los tests con SQL mockeado no pueden ver.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install deps (for schema checks)
        run: npm ci --legacy-peer-deps
      - name: WhatsApp schema contract
        env:
          DATABASE_URL: postgresql://trama:trama_local_dev@localhost:5433/trama
        run: npm run check:whatsapp-schema

      - name: PDF stamp assets schema contract
        env:
          DATABASE_URL: postgresql://trama:trama_local_dev@localhost:5433/trama
        run: npm run check:pdf-stamp-assets-schema

      # Legacy identity cutover: contra la DB recien migrada, verifica que
      # user_id ya no tenga DEFAULT 'legacy-single-user' en tablas privadas
      # historicas. Un INSERT sin user_id debe fallar, no caer al tenant legacy.
      - name: Legacy identity schema contract
        env:
          DATABASE_URL: postgresql://trama:trama_local_dev@localhost:5433/trama
        run: npm run check:legacy-identity-schema

      # Integración de comportamiento: corre el código REAL de persistencia
      # (persistCapture/persist-media) contra la DB migrada, validando RLS entre
      # usuarios, el CTE atómico de citas, casts y procedencia — lo que el SQL
      # mockeado de los tests unitarios no puede ver.
      - name: WhatsApp persist integration (real Postgres)
        env:
          WHATSAPP_IT_DB_URL: postgresql://trama:trama_local_dev@localhost:5433/trama
        run: npm run test:whatsapp-it

      # Motor de queries (Fase 1): compila el AST a SQL parametrizado y lo corre
      # contra la DB migrada — valida rango/cross-tipo/FTS y aislamiento RLS, que
      # el SQL mockeado de los tests unitarios no puede ver.
      - name: Query engine integration (real Postgres)
        env:
          QUERY_IT_DB_URL: postgresql://trama:trama_local_dev@localhost:5433/trama
        run: npm run test:query-it

      # Contratos backend/data: ejercita handlers reales contra la DB migrada
      # para cubrir happy paths endpoint→Postgres que los mocks SQL no prueban.
      - name: Backend data contracts integration (real Postgres)
        env:
          BACKEND_DATA_IT_DB_URL: postgresql://trama:trama_local_dev@localhost:5433/trama
        run: npm run test:backend-data-it

      # Performance contract: los listados calientes por user_id deben seguir
      # usando índices verificables cuando la DB ya tiene fixtures suficientes.
      - name: Query plans contract
        env:
          DATABASE_URL: postgresql://trama:trama_local_dev@localhost:5433/trama
        run: npm run check:query-plans

      # Idempotencia: re-correr no debe aplicar ninguna migración nueva
      # (todas quedaron registradas en _migrations). Esto valida que el
      # tracking incremental — el mismo modelo que usa Netlify — funciona.
      - name: Re-apply is a no-op (idempotency)
        env:
          DATABASE_URL: postgresql://trama:trama_local_dev@localhost:5433/trama
        run: |
          out=$(scripts/apply-migrations.sh)
          echo "$out"
          echo "$out" | grep -q "Applied 0 new migration(s)." || {
            echo "::error::Re-run aplicó migraciones de nuevo — el tracking en _migrations está roto"
            exit 1
          }

      # Regresión de los CTE atómicos de los handlers (entities-merge, cascade
      # DELETE/restore, momento POST) contra Postgres real. Corre sobre una DB
      # throwaway recién creada — el SQL crea sus propias tablas, así que NO debe
      # tocar la DB migrada `trama`.
      - name: CTE atomicity regression
        env:
          PGPASSWORD: trama_local_dev
        run: |
          createdb -h localhost -p 5433 -U trama cte_regression
          DATABASE_URL=postgresql://trama:trama_local_dev@localhost:5433/cte_regression \
            npm run check:cte-regression
