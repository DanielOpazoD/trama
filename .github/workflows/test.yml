name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# R1: el workflow se dividió en jobs paralelos:
#
#   lint    → eslint + prettier check
#   unit    → typecheck + vitest + coverage + build + bundle-size + audit
#   e2e     → Playwright + axe-core a11y
#   secrets → gitleaks (D4): escaneo de secretos sobre todo el historial
#
# Comparten install + cache de npm pero corren en runners distintos en
# simultáneo. Antes el workflow era un solo job secuencial de ~5min;
# ahora el critical path está cerca de los ~3min (limitado por el e2e
# que es el más lento).

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # N1: lint + format check.
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # N8: coverage con thresholds calibrados al baseline. Falla si
      # baja del piso (ver vitest.config.ts).
      - name: Coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Build
        run: npm run build

      # N8: npm audit (warn-only). Falla solo en CRITICAL.
      - name: Security audit (production deps)
        run: npm audit --omit=dev --audit-level=critical
        continue-on-error: true

      # G4: bundle-size budget. Falla si un chunk crece más de su tope.
      - name: Bundle size budget
        run: node scripts/check-bundle-size.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Playwright browsers no van en npm ci (~100MB). Los instalamos
      # solo en este job, no en lint/unit.
      - name: Install Playwright browsers
        run: npm run e2e:install

      - name: Run E2E tests
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # D4: secret scanning. gitleaks escanea TODO el historial de git
  # (fetch-depth: 0) contra el ruleset por defecto + la allowlist de
  # .gitleaks.toml. Si encuentra una clave commiteada, falla el merge.
  # Bajamos un binario pinneado en vez de la action oficial para evitar
  # el chequeo de licencia de org y mantener el job determinístico.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.18.4
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for secrets
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose
