<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Trama monogram woven T — adaptado del TramaMark.
       Usa currentColor para que respete dark mode si el browser lo soporta
       (Safari/Firefox respetan color-scheme: light dark). En light, el
       favicon viene en ink-700; en dark, paper-50. -->
  <style>
    @media (prefers-color-scheme: dark) {
      :root { color: #fafafa; }
    }
    @media (prefers-color-scheme: light) {
      :root { color: #18181b; }
    }
  </style>
  <rect width="32" height="32" rx="6" fill="transparent" />
  <path d="M7 8h18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
  <path d="M16 8v18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
  <path d="M12 15l8 5M20 15l-8 5"
        stroke="currentColor" stroke-width="1.6"
        stroke-linecap="round" stroke-opacity="0.55" />
</svg>
