<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- OG image — la que aparece cuando alguien comparte un link de Trama
       en Twitter/Slack/LinkedIn. Identidad editorial: paper-50 bg, serif
       Trama bien grande, aforismo en italic, monograma a la derecha. -->
  <rect width="1200" height="630" fill="#ffffff" />

  <!-- Sutil ornament line en la base — guiño editorial -->
  <line x1="80" y1="555" x2="160" y2="555"
        stroke="#27272a" stroke-width="2" stroke-linecap="round" opacity="0.4" />

  <!-- Eyebrow uppercase -->
  <text x="80" y="170"
        font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="22" font-weight="500"
        letter-spacing="6"
        fill="#71717a">
    MAPA COGNITIVO PERSONAL
  </text>

  <!-- Wordmark serif gigante -->
  <text x="80" y="320"
        font-family="Spectral, 'Iowan Old Style', Palatino, Georgia, serif"
        font-size="180" font-weight="400"
        letter-spacing="-4"
        fill="#18181b">
    Trama
  </text>

  <!-- Aforismo italic -->
  <text x="80" y="430"
        font-family="Spectral, 'Iowan Old Style', Palatino, Georgia, serif"
        font-size="38" font-style="italic" font-weight="300"
        fill="#52525b">
    Hilo a hilo.
  </text>

  <!-- URL minimalista -->
  <text x="80" y="540"
        font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="18" font-weight="400"
        fill="#a1a1aa">
    trama
  </text>

  <!-- Monograma TramaMark a la derecha, grande, ink-700 -->
  <g transform="translate(870, 165)">
    <path d="M0 50h220" stroke="#18181b" stroke-width="10" stroke-linecap="round" />
    <path d="M110 50v200" stroke="#18181b" stroke-width="10" stroke-linecap="round" />
    <path d="M55 130l110 50M165 130l-110 50"
          stroke="#18181b" stroke-width="6"
          stroke-linecap="round" opacity="0.55" />
  </g>
</svg>
