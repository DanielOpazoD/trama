services:
  postgres:
    # pgvector/pgvector:pg16 = postgres:16 + la extensión `vector` precompilada
    # (más pg_trgm y pgcrypto en contrib). La migración `embeddings` hace
    # `CREATE EXTENSION IF NOT EXISTS vector`, que `postgres:16-alpine` no puede
    # satisfacer — con alpine, `db:up` abortaba al llegar a esa migración.
    # Misma imagen que usa el job `migrations` de CI, así local == CI.
    image: pgvector/pgvector:pg16
    container_name: trama-postgres
    environment:
      POSTGRES_USER: trama
      POSTGRES_PASSWORD: trama_local_dev
      POSTGRES_DB: trama
    ports:
      - '5433:5432'
    volumes:
      - trama_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trama -d trama']
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  trama_pg_data:
