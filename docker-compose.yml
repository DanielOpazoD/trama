services:
  postgres:
    image: postgres:16-alpine
    container_name: trama-postgres
    environment:
      POSTGRES_USER: trama
      POSTGRES_PASSWORD: trama_local_dev
      POSTGRES_DB: trama
    ports:
      - '5433:5432'
    volumes:
      - trama_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trama -d trama']
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  trama_pg_data:
