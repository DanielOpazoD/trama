<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      /* Registro editorial de Trama: papel/tinta, serif para el texto.
         Soporta tema claro y oscuro (prefers-color-scheme -> paper / night). */
      :root {
        --paper: #ffffff;
        --paper-2: #faf8f3;
        --paper-3: #f1ece2;
        --ink: #1a1812;
        --ink-muted: #5c574c;
        --ink-faint: #9b9486;
        --border: #e6e0d4;
        --accent: #1f4d6b;
        --gold: #a07900;
        --sage: #4a6b4f;
        --clay: #8a3b2e;
      }
      /* Tema noche (frío) — automático con el sistema, o forzado con
         data-theme="night". */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          --paper: #14110c;
          --paper-2: #1c1813;
          --paper-3: #26201a;
          --ink: #f3ead6;
          --ink-muted: #b3a98f;
          --ink-faint: #6f6757;
          --border: #2f2820;
          --accent: #8db8d6;
          --gold: #d4b36a;
          --sage: #8fb094;
          --clay: #cf7a5f;
        }
      }
      html[data-theme='night'] {
        --paper: #14110c;
        --paper-2: #1c1813;
        --paper-3: #26201a;
        --ink: #f3ead6;
        --ink-muted: #b3a98f;
        --ink-faint: #6f6757;
        --border: #2f2820;
        --accent: #8db8d6;
        --gold: #d4b36a;
        --sage: #8fb094;
        --clay: #cf7a5f;
      }
      /* Tema vela (cálido) — el sepia de lectura nocturna de la casa. */
      html[data-theme='vela'] {
        --paper: #1a140e;
        --paper-2: #241a12;
        --paper-3: #2e2218;
        --ink: #f7eedc;
        --ink-muted: #b3a285;
        --ink-faint: #7d7058;
        --border: #3a2e1f;
        --accent: #b8a070;
        --gold: #e0b863;
        --sage: #8fb094;
        --clay: #cf7a5f;
      }
      /* Tema papel forzado (claro aunque el sistema esté oscuro). */
      html[data-theme='paper'] {
        --paper: #ffffff;
        --paper-2: #faf8f3;
        --paper-3: #f1ece2;
        --ink: #1a1812;
        --ink-muted: #5c574c;
        --ink-faint: #9b9486;
        --border: #e6e0d4;
        --accent: #1f4d6b;
        --gold: #a07900;
        --sage: #4a6b4f;
        --clay: #8a3b2e;
      }
      /* Selector de tema. */
      .theme-row {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 10.5px;
        color: var(--ink-muted);
        margin-top: 2px;
      }
      .theme-row .opts {
        display: flex;
        gap: 4px;
      }
      .theme-opt {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--ink-faint);
        border-radius: 999px;
        padding: 3px 9px;
        font-size: 10px;
        cursor: pointer;
      }
      .theme-opt[aria-pressed='true'] {
        border-color: var(--accent);
        color: var(--ink);
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 348px;
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          13px/1.5 Inter,
          system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      header {
        padding: 13px 16px 11px;
        border-bottom: 1px solid var(--border);
        background: var(--paper-2);
      }
      .eyebrow {
        font-size: 9.5px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--gold);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .eyebrow svg {
        width: 12px;
        height: 12px;
      }
      h1 {
        margin: 3px 0 0;
        font:
          600 16px/1.25 Georgia,
          'Times New Roman',
          serif;
      }
      main {
        padding: 14px 16px;
        display: grid;
        gap: 11px;
      }
      /* Selector de modo de captura (segmented control). */
      .modes {
        display: flex;
        gap: 3px;
        padding: 3px;
        background: var(--paper-3);
        border-radius: 999px;
      }
      .mode-opt {
        flex: 1;
        border: 0;
        background: transparent;
        color: var(--ink-muted);
        border-radius: 999px;
        padding: 6px 4px;
        white-space: nowrap;
        font:
          600 11px Inter,
          system-ui,
          sans-serif;
        cursor: pointer;
        transition:
          background 0.14s ease,
          color 0.14s ease;
      }
      .mode-opt[aria-pressed='true'] {
        background: var(--paper);
        color: var(--ink);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      }
      .mode-hint {
        font:
          italic 11.5px/1.45 Georgia,
          serif;
        color: var(--ink-faint);
        padding: 2px 2px 0;
      }
      label {
        display: grid;
        gap: 4px;
        font-size: 10.5px;
        letter-spacing: 0.02em;
        color: var(--ink-muted);
      }
      .label-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .count {
        font-size: 10px;
        color: var(--ink-faint);
        font-variant-numeric: tabular-nums;
      }
      textarea,
      input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--paper-2);
        color: var(--ink);
        padding: 8px 10px;
        font: inherit;
      }
      textarea:focus,
      input:focus {
        outline: none;
        border-color: var(--accent);
      }
      #texto {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 13.5px;
        line-height: 1.55;
        min-height: 92px;
        resize: vertical;
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 8px 15px;
        font:
          600 12px Inter,
          system-ui,
          sans-serif;
        cursor: pointer;
        transition:
          transform 0.12s ease,
          opacity 0.15s ease;
      }
      button:active {
        transform: scale(0.96);
      }
      #guardar {
        background: var(--ink);
        color: var(--paper);
      }
      #guardar:disabled {
        opacity: 0.35;
        cursor: default;
        transform: none;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      #estado {
        font:
          italic 12px Georgia,
          serif;
        color: var(--ink-muted);
        min-height: 1.2em;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      #estado.ok {
        color: var(--sage);
      }
      #estado.err {
        color: var(--clay);
      }
      #estado .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      #estado.flash .dot {
        animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      @keyframes pop {
        0% {
          transform: scale(0);
        }
        70% {
          transform: scale(1.5);
        }
        100% {
          transform: scale(1);
        }
      }
      details {
        border-bottom: 1px solid var(--border);
        padding: 9px 16px 11px;
        background: var(--paper-2);
      }
      #connLabel {
        text-transform: none;
        letter-spacing: 0.14em;
      }
      summary {
        cursor: pointer;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-faint);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      summary .conn-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ink-faint);
      }
      summary .conn-dot.ok {
        background: var(--sage);
      }
      summary .conn-dot.err {
        background: var(--clay);
      }
      details main {
        padding: 11px 0 0;
      }
      .hint {
        font-size: 10.5px;
        line-height: 1.5;
        color: var(--ink-faint);
      }
      a {
        color: var(--accent);
      }
      .secondary {
        background: transparent;
        color: var(--ink-muted);
        padding: 7px 12px;
        font-size: 11px;
      }
      .secondary:hover {
        color: var(--ink);
      }
      .queue-note {
        font-size: 10.5px;
        color: var(--gold);
        font-style: italic;
      }
      .more-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .tray-link {
        font-size: 10.5px;
        color: var(--accent);
        text-decoration: none;
        white-space: nowrap;
      }
      .tray-link:hover {
        text-decoration: underline;
      }
      /* Favorito: acción evidente, con estrella que se dora al guardar. */
      .fav-btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 7px 14px;
        font:
          600 12px Inter,
          system-ui,
          sans-serif;
        color: var(--ink-muted);
        cursor: pointer;
        transition:
          border-color 0.14s ease,
          color 0.14s ease;
      }
      .fav-btn:hover {
        border-color: var(--gold);
        color: var(--ink);
      }
      .fav-btn .star {
        font-size: 16px;
        line-height: 1;
        color: var(--ink-faint);
        transition:
          color 0.14s ease,
          transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .fav-btn:hover .star {
        color: var(--gold);
      }
      .fav-btn.saved {
        border-color: var(--gold);
        color: var(--gold);
      }
      .fav-btn.saved .star {
        color: var(--gold);
        transform: scale(1.2);
      }
      .fav-btn:disabled {
        cursor: default;
        opacity: 1;
      }
      /* Mini-bandeja: los últimos recortes pendientes, leídos del servidor. */
      .recent {
        border-top: 1px solid var(--border);
        padding: 11px 16px 13px;
      }
      .recent-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 7px;
      }
      .recent-head .label {
        font-size: 9.5px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink-faint);
      }
      .recent-head a {
        font-size: 10.5px;
        text-decoration: none;
      }
      .recent-head a:hover {
        text-decoration: underline;
      }
      .recent-item {
        display: flex;
        gap: 8px;
        padding: 6px 0;
        border-top: 1px solid var(--border);
        text-decoration: none;
        color: inherit;
      }
      .recent-item:first-of-type {
        border-top: 0;
      }
      .recent-item img {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        margin-top: 2px;
        flex: none;
      }
      .recent-item .ri-body {
        min-width: 0;
      }
      .recent-item .ri-text {
        font:
          italic 12px/1.4 Georgia,
          serif;
        color: var(--ink);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .recent-item .ri-meta {
        font-size: 9.5px;
        color: var(--ink-faint);
        margin-top: 1px;
      }
      .recent-empty {
        font:
          italic 11.5px Georgia,
          serif;
        color: var(--ink-faint);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="eyebrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="6" cy="6" r="2.6" />
          <circle cx="6" cy="18" r="2.6" />
          <path d="M8.2 7.6 20 19M8.2 16.4 20 5" stroke-linecap="round" />
        </svg>
        trama &middot; recortes
      </div>
      <h1>Guardar en la bandeja</h1>
    </header>
    <details id="config">
      <summary>
        <span class="conn-dot" id="connDot"></span>
        <span id="connLabel">conexión</span>
      </summary>
      <main>
        <label>
          Token personal
          <input id="token" type="password" placeholder="trama_pat_&hellip;" />
        </label>
        <label>
          Servidor
          <input id="baseUrl" placeholder="https://tramahub.app" />
        </label>
        <p class="hint">
          El token se genera en Trama &rarr; Configuracion &rarr; Conectar extension, y
          vive solo en este navegador.
        </p>
        <div class="theme-row">
          <span>Tema</span>
          <div class="opts" id="themeOpts">
            <button class="theme-opt" data-theme="auto">auto</button>
            <button class="theme-opt" data-theme="paper">papel</button>
            <button class="theme-opt" data-theme="night">noche</button>
            <button class="theme-opt" data-theme="vela">vela</button>
          </div>
        </div>
        <div class="row">
          <button class="secondary" id="probar">Probar conexion</button>
          <button id="guardarConfig">Guardar conexion</button>
        </div>
      </main>
    </details>
    <main>
      <div class="modes" id="modes" role="group" aria-label="Modo de captura">
        <button class="mode-opt" data-mode="citation" aria-pressed="true">Cita</button>
        <button class="mode-opt" data-mode="article" aria-pressed="false">
          Artículo
        </button>
        <button class="mode-opt" data-mode="region" aria-pressed="false">Región</button>
      </div>
      <p class="mode-hint" id="modeHint" hidden></p>
      <label id="textoLabel">
        <div class="label-row">
          <span>Texto</span>
          <span class="count" id="count">0</span>
        </div>
        <textarea
          id="texto"
          placeholder="Selecciona texto en la pagina o pegalo aqui&hellip;"
        ></textarea>
      </label>
      <div class="row">
        <span id="estado"></span>
        <button id="guardar">Guardar en Recortes</button>
      </div>
      <div class="more-actions" id="moreActions">
        <button
          class="fav-btn"
          id="saveFavorite"
          title="Guarda esta página en tus Favoritos para volver"
        >
          <span class="star" id="favStar">&#9734;</span> Favorito
        </button>
        <a
          class="tray-link"
          id="openFavorites"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
          >ver favoritos &rarr;</a
        >
      </div>
      <p class="queue-note" id="queueNote" hidden></p>
    </main>
    <section class="recent" id="recent" hidden>
      <div class="recent-head">
        <span class="label">en tu bandeja</span>
        <a id="openTray" href="#">ver bandeja &rarr;</a>
      </div>
      <div id="recentList"></div>
    </section>
    <script src="popup.js"></script>
  </body>
</html>
