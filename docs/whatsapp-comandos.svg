<text x="64" y="1470" font-family="'Inter','Helvetica Neue','Arial',sans-serif" font-size="16" fill="#7A7367">Conecta tu número en Trama → Configuración → WhatsApp y envía:  <tspan font-family="'SFMono-Regular','Menlo','Consolas',monospace" fill="#2B2B2B">vincular &lt;código&gt;</tspan></text>
<text x="64" y="1494" font-family="'Inter','Helvetica Neue','Arial',sans-serif" font-size="14" fill="#7A7367">También funciona con «/» (ej. /nota …). El prefijo es instantáneo; el texto libre usa IA.</text>
