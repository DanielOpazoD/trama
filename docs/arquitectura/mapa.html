    <style>
      :root {
        --bg: #f7f5f1;
        --bg-panel: #fffefb;
        --bg-sunken: #efece5;
        --ink: #1e1c19;
        --ink-soft: #5c574f;
        --ink-faint: #8d867c;
        --line: #ddd7cc;
        --line-soft: #e9e4da;
        --accent: #3d7fb5;
        --node-bg: #fffefb;
        --node-stroke: #d8d2c6;
        --node-ink: #2a2723;
        --edge: #b6ada0;
        --shadow: 0 1px 2px rgba(30, 28, 25, 0.06), 0 4px 14px rgba(30, 28, 25, 0.05);
        --shadow-lg: 0 8px 30px rgba(30, 28, 25, 0.14);
        --radius: 10px;
        --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root[data-theme='auto'] {
          --bg: #16181c;
          --bg-panel: #1d2025;
          --bg-sunken: #14161a;
          --ink: #e8e6e1;
          --ink-soft: #a8a49c;
          --ink-faint: #7b776f;
          --line: #2e323a;
          --line-soft: #262a31;
          --accent: #6aa9dd;
          --node-bg: #23272e;
          --node-stroke: #363b44;
          --node-ink: #e4e2dd;
          --edge: #4a505b;
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 14px rgba(0, 0, 0, 0.3);
          --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.5);
        }
      }
      :root[data-theme='dark'] {
        --bg: #16181c;
        --bg-panel: #1d2025;
        --bg-sunken: #14161a;
        --ink: #e8e6e1;
        --ink-soft: #a8a49c;
        --ink-faint: #7b776f;
        --line: #2e323a;
        --line-soft: #262a31;
        --accent: #6aa9dd;
        --node-bg: #23272e;
        --node-stroke: #363b44;
        --node-ink: #e4e2dd;
        --edge: #4a505b;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 14px rgba(0, 0, 0, 0.3);
        --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.5);
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: var(--font);
        background: var(--bg);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        font-size: 14px;
        line-height: 1.5;
      }

      .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

      /* ---------- Cabecera ---------- */
      header.top {
        display: flex; align-items: center; gap: 18px;
        padding: 12px 18px;
        border-bottom: 1px solid var(--line);
        background: var(--bg-panel);
        flex-wrap: wrap;
      }
      .brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
      .brand h1 { font-size: 16px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
      .brand .sub { font-size: 12.5px; color: var(--ink-faint); }
      .stats { display: flex; gap: 16px; flex-wrap: wrap; }
      .stat { display: flex; flex-direction: column; line-height: 1.15; }
      .stat b { font-size: 14px; font-weight: 640; font-variant-numeric: tabular-nums; }
      .stat span { font-size: 10.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.05em; }
      .icon-btn {
        border: 1px solid var(--line); background: var(--bg-panel); color: var(--ink-soft);
        width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 14px;
        display: inline-flex; align-items: center; justify-content: center; padding: 0;
      }
      .icon-btn:hover { border-color: var(--accent); color: var(--accent); }

      /* ---------- Cuerpo ---------- */
      main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 372px; min-height: 0; }

      .stage { position: relative; min-width: 0; min-height: 0; background: var(--bg-sunken); overflow: hidden; }
      svg#diagram { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
      svg#diagram.dragging { cursor: grabbing; }

      .toolbar {
        position: absolute; top: 12px; left: 12px; right: 12px;
        display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none;
      }
      .toolbar > * { pointer-events: auto; }
      .tool-group {
        display: flex; background: var(--bg-panel); border: 1px solid var(--line);
        border-radius: 8px; box-shadow: var(--shadow); overflow: hidden;
      }
      .tool-group button {
        border: 0; background: transparent; color: var(--ink-soft); cursor: pointer;
        padding: 7px 11px; font-size: 12.5px; font-family: inherit; border-right: 1px solid var(--line-soft);
      }
      .tool-group button:last-child { border-right: 0; }
      .tool-group button:hover { background: var(--bg-sunken); color: var(--ink); }
      .search-wrap { position: relative; }
      #search {
        width: 210px; max-width: 42vw; padding: 7px 11px 7px 30px; font-size: 12.5px; font-family: inherit;
        border: 1px solid var(--line); border-radius: 8px; background: var(--bg-panel); color: var(--ink);
        box-shadow: var(--shadow);
      }
      #search:focus { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 1px; }
      .search-wrap::before {
        content: '⌕'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
        color: var(--ink-faint); font-size: 14px; pointer-events: none;
      }
      #clear-btn { display: none; }
      #clear-btn.on { display: inline-block; }

      /* Leyenda y pista comparten una barra: nunca se pisan al angostar. */
      .bottom-bar {
        position: absolute; left: 12px; right: 12px; bottom: 12px;
        display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
        pointer-events: none;
      }
      .bottom-bar > * { pointer-events: auto; }
      .legend {
        display: flex; gap: 5px; flex-wrap: wrap; min-width: 0;
        background: color-mix(in srgb, var(--bg-panel) 92%, transparent);
        border: 1px solid var(--line); border-radius: 8px; padding: 6px; box-shadow: var(--shadow);
        backdrop-filter: blur(6px);
      }
      .legend button {
        display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-family: inherit;
        border: 1px solid transparent; background: transparent; color: var(--ink-soft);
        border-radius: 6px; padding: 3px 7px; cursor: pointer;
      }
      .legend button:hover { background: var(--bg-sunken); }
      .legend button.off { opacity: 0.4; }
      .legend .swatch { width: 9px; height: 9px; border-radius: 2.5px; }

      .hint {
        font-size: 11.5px; color: var(--ink-faint); white-space: nowrap; flex: none;
        background: color-mix(in srgb, var(--bg-panel) 92%, transparent);
        border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px;
        backdrop-filter: blur(6px);
      }
      @media (max-width: 1400px) { .hint { display: none; } }

      /* ---------- Nodos y aristas ---------- */
      .node rect.body {
        fill: var(--node-bg); stroke: var(--node-stroke); stroke-width: 1;
        rx: 8; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.05));
      }
      .node { cursor: pointer; }
      .node text { fill: var(--node-ink); font-size: 12px; font-family: var(--font); pointer-events: none; }
      .node:hover rect.body { stroke: var(--accent); stroke-width: 1.6; }
      .node.dim { opacity: 0.16; }
      .node.hit { opacity: 1; }
      .node.selected rect.body { stroke: var(--accent); stroke-width: 2.2; }
      .node.in-flow rect.body { stroke-width: 2.2; }

      path.edge { fill: none; stroke: var(--edge); stroke-width: 1.1; opacity: 0.5; }
      path.edge.k-nav { stroke-dasharray: 3 4; opacity: 0.22; }
      path.edge.k-auth { stroke: #8265b8; opacity: 0.5; }
      path.edge.k-storage { stroke: #96793f; opacity: 0.5; }
      path.edge.k-externo { stroke: #c07a3e; opacity: 0.55; }
      path.edge.k-ci { stroke: #6b7a8f; opacity: 0.5; }
      path.edge.dim { opacity: 0.06; }
      path.edge.lit { opacity: 0.95; stroke-width: 2; }
      path.edge-hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }

      path.flow-path {
        fill: none; stroke-width: 2.6; stroke-linecap: round;
        stroke-dasharray: 9 6; animation: march 1.1s linear infinite;
      }
      @keyframes march { to { stroke-dashoffset: -15; } }
      @media (prefers-reduced-motion: reduce) {
        path.flow-path { animation: none; stroke-dasharray: none; }
      }
      .step-badge circle { stroke: var(--bg-panel); stroke-width: 2; }
      .step-badge text { font-size: 10.5px; font-weight: 700; fill: #fff; text-anchor: middle; font-family: var(--font); }

      .band rect { fill: var(--ink); opacity: 0.022; }
      .band text {
        fill: var(--ink-faint); font-size: 10.5px; letter-spacing: 0.13em;
        text-transform: uppercase; font-family: var(--font); font-weight: 600;
      }

      /* ---------- Tooltip ---------- */
      #tip {
        position: fixed; z-index: 40; max-width: min(330px, calc(100vw - 24px)); pointer-events: none; opacity: 0;
        transition: opacity 0.12s ease; background: var(--bg-panel); color: var(--ink);
        border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow-lg);
      }
      #tip.on { opacity: 1; }
      #tip .t-head { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
      #tip .t-dot { width: 8px; height: 8px; border-radius: 2.5px; flex: none; }
      #tip .t-title { font-weight: 640; font-size: 13px; }
      #tip .t-layer { font-size: 10.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.05em; }
      #tip .t-body { font-size: 12.5px; color: var(--ink-soft); line-height: 1.45; }
      #tip .t-files { margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--line-soft); }
      #tip .t-files code { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      /* ---------- Panel ---------- */
      aside.panel {
        border-left: 1px solid var(--line); background: var(--bg-panel);
        display: flex; flex-direction: column; min-height: 0;
      }
      .tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; }
      .tabs button {
        flex: 1; border: 0; background: transparent; font-family: inherit; font-size: 13px;
        padding: 11px 8px; cursor: pointer; color: var(--ink-faint); border-bottom: 2px solid transparent;
      }
      .tabs button[aria-selected='true'] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
      .panel-body { overflow-y: auto; padding: 12px; flex: 1; min-height: 0; }
      .panel-body::-webkit-scrollbar { width: 9px; }
      .panel-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }

      .flow-card {
        border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 8px;
        overflow: hidden; background: var(--bg-panel);
      }
      .flow-card.active { border-color: var(--accent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent); }
      .flow-head {
        display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left;
        border: 0; background: transparent; font-family: inherit; cursor: pointer; padding: 11px 12px; color: inherit;
      }
      .flow-head:hover { background: var(--bg-sunken); }
      .flow-num {
        flex: none; width: 22px; height: 22px; border-radius: 6px; background: var(--bg-sunken);
        color: var(--ink-faint); font-size: 11px; font-weight: 700; display: grid; place-items: center;
        font-variant-numeric: tabular-nums;
      }
      .flow-card.active .flow-num { background: var(--accent); color: #fff; }
      .flow-title { font-size: 13.5px; font-weight: 600; letter-spacing: -0.005em; }
      .flow-sum { font-size: 12px; color: var(--ink-soft); margin-top: 3px; line-height: 1.45; }
      .flow-meta { font-size: 11px; color: var(--ink-faint); margin-top: 5px; }
      .steps { padding: 0 12px 12px 12px; display: none; }
      .flow-card.active .steps { display: block; }
      .step {
        display: grid; grid-template-columns: 22px 1fr; gap: 9px; align-items: start;
        padding: 7px 0; border-top: 1px solid var(--line-soft); width: 100%; text-align: left;
        background: transparent; border-left: 0; border-right: 0; border-bottom: 0; font-family: inherit;
        cursor: pointer; color: inherit;
      }
      .step:hover .step-label { color: var(--accent); }
      .step-i {
        width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;
        font-size: 10.5px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; margin-top: 1px;
      }
      .step-label { font-size: 12.5px; line-height: 1.4; }
      .step-node { font-size: 11px; color: var(--ink-faint); }
      .step-file { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); word-break: break-all; }

      .detail-title { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
      .detail-dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
      .detail-title h2 { margin: 0; font-size: 15px; font-weight: 650; }
      .detail-layer { font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
      .detail-purpose { font-size: 13px; color: var(--ink-soft); line-height: 1.55; margin-bottom: 14px; }
      .detail-h {
        font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-faint);
        margin: 14px 0 7px; font-weight: 650;
      }
      .file-list code {
        display: block; font-family: var(--mono); font-size: 11px; color: var(--ink-soft);
        background: var(--bg-sunken); border: 1px solid var(--line-soft); border-radius: 6px;
        padding: 5px 8px; margin-bottom: 4px; word-break: break-all;
      }
      .chips { display: flex; flex-wrap: wrap; gap: 5px; }
      .chip {
        font-size: 11.5px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px;
        background: var(--bg-panel); cursor: pointer; font-family: inherit; color: var(--ink-soft);
      }
      .chip:hover { border-color: var(--accent); color: var(--accent); }
      .chip .arrow { color: var(--ink-faint); margin-right: 3px; }
      .empty { color: var(--ink-faint); font-size: 12.5px; padding: 24px 6px; text-align: center; line-height: 1.6; }
      .kbd {
        font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--line);
        border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; color: var(--ink-soft);
      }

      /* En táctil el tooltip taparía media pantalla y el toque ya abre la ficha. */
      @media (hover: none) {
        #tip { display: none; }
      }

      @media (max-width: 1080px) {
        main { grid-template-columns: 1fr; grid-template-rows: 58vh minmax(0, 1fr); }
        aside.panel { border-left: 0; border-top: 1px solid var(--line); }
        .hint { display: none; }
        .stats { gap: 12px; }
      }
      @media (max-width: 640px) {
        .stats .stat:nth-child(n + 4) { display: none; }
        #search { width: 140px; }
        .legend { max-width: calc(100% - 24px); }
      }
    </style>
  </head>

      /* mapa:fin */

      /* =====================================================================

      const byId = new Map(DATA.nodes.map((n) => [n.id, n]));
      const layerById = new Map(DATA.meta.layers.map((l) => [l.id, l]));
      const colorOf = (id) => layerById.get(byId.get(id).layer).color;
      const esc = (s) =>
        String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

      const svg = document.getElementById('diagram');

      const gEdges = document.getElementById('edges');
      const gEdgeHits = document.getElementById('edge-hits');
      const gFlow = document.getElementById('flowlayer');
      const gNodes = document.getElementById('nodes');
      const gBadges = document.getElementById('badges');
      const tip = document.getElementById('tip');

      const EXTENT = DATA.nodes.reduce(
        (a, n) => ({ w: Math.max(a.w, n.x + n.w), h: Math.max(a.h, n.y + n.h) }),
        { w: 0, h: 0 },
      );
      const PAD = 56;
      const WORLD = { w: EXTENT.w + PAD, h: EXTENT.h + PAD };

      /* =====================================================================
         Cabecera
      ===================================================================== */
      document.getElementById('sub').textContent =
        DATA.meta.commit + ' · ' + DATA.meta.generatedAt;
      const statDefs = [
        ['Nodos', DATA.nodes.length],
        ['Flujos', DATA.flows.length],
        ['Endpoints', DATA.meta.stats.endpoints],
        ['Migraciones', DATA.meta.stats.migraciones],
        ['Tests', DATA.meta.stats.archivosDeTest],

      ];
      document.getElementById('stats').innerHTML = statDefs
        .map(([k, v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`)
        .join('');

      /* =====================================================================
         Marcadores de flecha
      ===================================================================== */
      const defs = svg.querySelector('defs');
      const markerColors = {
        edge: 'var(--edge)', auth: '#8265b8', storage: '#96793f', externo: '#c07a3e', ci: '#6b7a8f',
      };
      for (const [name, color] of Object.entries(markerColors)) {
        const m = el('marker', {
          id: 'arrow-' + name, viewBox: '0 0 10 10', refX: '9', refY: '5',

      DATA.meta.layers.forEach((l) => {

          markerWidth: '5.5', markerHeight: '5.5', orient: 'auto-start-reverse',

        m.appendChild(el('path', { d: 'M 0 1 L 9 5 L 0 9 z', fill: l.color }));
        defs.appendChild(m);
      });

      /* =====================================================================
         Bandas por capa
      ===================================================================== */
      DATA.meta.layers.forEach((layer) => {
        const ns = DATA.nodes.filter((n) => n.layer === layer.id);
        if (!ns.length) return;
        const top = Math.min(...ns.map((n) => n.y)) - 14;
        const bottom = Math.max(...ns.map((n) => n.y + n.h)) + 14;
        const g = el('g', { class: 'band' });
        g.appendChild(el('rect', { x: 8, y: top, width: WORLD.w - 16, height: bottom - top, rx: 12 }));
        const t = el('text', {
          x: 30, y: (top + bottom) / 2, 'text-anchor': 'middle',
          transform: `rotate(-90 30 ${(top + bottom) / 2})`,
        });
        t.textContent = layer.label;
        g.appendChild(t);
        gBands.appendChild(g);
      });

      /* =====================================================================
         Ruteo de aristas: anclas repartidas para abrir los abanicos
      ===================================================================== */
      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

      function anchors(a, b) {
        const acx = a.x + a.w / 2, acy = a.y + a.h / 2;
        const bcx = b.x + b.w / 2, bcy = b.y + b.h / 2;
        const inset = 14;
        if (b.y > a.y + a.h - 4) {
          return {
            x1: clamp(bcx, a.x + inset, a.x + a.w - inset), y1: a.y + a.h,
            x2: clamp(acx, b.x + inset, b.x + b.w - inset), y2: b.y,
            vertical: true,
          };
        }
        if (b.y + b.h < a.y + 4) {
          return {
            x1: clamp(bcx, a.x + inset, a.x + a.w - inset), y1: a.y,
            x2: clamp(acx, b.x + inset, b.x + b.w - inset), y2: b.y + b.h,
            vertical: true,
          };
        }
        const leftToRight = bcx >= acx;
        return {
          x1: leftToRight ? a.x + a.w : a.x, y1: acy,
          x2: leftToRight ? b.x : b.x + b.w, y2: bcy,
          vertical: false,
        };
      }

      function pathFor(a, b) {
        const p = anchors(a, b);
        if (p.vertical) {
          const d = Math.abs(p.y2 - p.y1);
          const off = Math.max(26, Math.min(70, d * 0.45));
          const dir = p.y2 > p.y1 ? 1 : -1;
          return `M ${p.x1} ${p.y1} C ${p.x1} ${p.y1 + off * dir}, ${p.x2} ${p.y2 - off * dir}, ${p.x2} ${p.y2}`;
        }
        const d = Math.abs(p.x2 - p.x1);
        const off = Math.max(24, Math.min(70, d * 0.45));
        const dir = p.x2 > p.x1 ? 1 : -1;
        return `M ${p.x1} ${p.y1} C ${p.x1 + off * dir} ${p.y1}, ${p.x2 - off * dir} ${p.y2}, ${p.x2} ${p.y2}`;
      }

      const edgeEls = [];
      DATA.edges.forEach((e, i) => {
        const a = byId.get(e.from), b = byId.get(e.to);
        const d = pathFor(a, b);
        const kind = e.kind === 'data' || e.kind === 'nav' ? 'edge' : e.kind;
        const p = el('path', { d, class: 'edge k-' + e.kind, 'marker-end': `url(#arrow-${kind})` });
        gEdges.appendChild(p);
        const hit = el('path', { d, class: 'edge-hit' });
        hit.addEventListener('mouseenter', (ev) => showEdgeTip(ev, e));
        hit.addEventListener('mousemove', moveTip);
        hit.addEventListener('mouseleave', hideTip);
        gEdgeHits.appendChild(hit);
        edgeEls.push({ e, p, i });
      });

      /* =====================================================================
         Nodos
      ===================================================================== */
      function wrap(text, max) {
        const words = String(text).split(/\s+/);
        const lines = [];
        let line = '';
        for (const w of words) {
          const candidate = line ? line + ' ' + w : w;
          if (candidate.length > max && line) { lines.push(line); line = w; } else { line = candidate; }
        }
        if (line) lines.push(line);
        return lines.slice(0, 3);
      }

      const nodeEls = new Map();
      DATA.nodes.forEach((n) => {
        const color = layerById.get(n.layer).color;
        const g = el('g', { class: 'node', 'data-id': n.id, tabindex: '0', role: 'button' });
        g.appendChild(el('rect', { class: 'body', x: n.x, y: n.y, width: n.w, height: n.h }));
        g.appendChild(el('rect', { x: n.x + 1, y: n.y + 1, width: 4, height: n.h - 2, rx: 2, fill: color }));

        const lines = wrap(n.label, 22);
        const lh = 14.5;
        const startY = n.y + n.h / 2 - ((lines.length - 1) * lh) / 2 + 4.5;
        const t = el('text', { x: n.x + n.w / 2 + 3, y: startY, 'text-anchor': 'middle' });
        lines.forEach((ln, i) => {
          const ts = el('tspan', { x: n.x + n.w / 2 + 3, dy: i === 0 ? 0 : lh });
          ts.textContent = ln;
          t.appendChild(ts);

        g.addEventListener('mouseenter', (ev) => showNodeTip(ev, n));
        g.addEventListener('mousemove', moveTip);
        g.addEventListener('mouseleave', hideTip);
        g.addEventListener('click', (ev) => { ev.stopPropagation(); selectNode(n.id); });
        g.addEventListener('keydown', (ev) => {

        });

        nodeEls.set(n.id, g);

      /* =====================================================================
         Tooltip
      ===================================================================== */
      function showNodeTip(ev, n) {
        const layer = layerById.get(n.layer);
        tip.innerHTML =
          `<div class="t-head"><span class="t-dot" style="background:${layer.color}"></span>` +
          `<span class="t-title">${esc(n.label)}</span></div>` +

          `<div class="t-body">${esc(n.purpose)}</div>` +

      function showEdgeTip(ev, e) {
        const a = byId.get(e.from), b = byId.get(e.to);
        tip.innerHTML =
          `<div class="t-head"><span class="t-title">${esc(a.label)} → ${esc(b.label)}</span></div>` +
          `<div class="t-body">${esc(e.label || 'relación de tipo ' + e.kind)}</div>`;

      function moveTip(ev) {
        const pad = 14, r = tip.getBoundingClientRect();
        let x = ev.clientX + pad, y = ev.clientY + pad;
        if (x + r.width > window.innerWidth - 8) x = ev.clientX - r.width - pad;
        if (y + r.height > window.innerHeight - 8) y = ev.clientY - r.height - pad;
        tip.style.left = Math.max(8, x) + 'px';
        tip.style.top = Math.max(8, y) + 'px';
      }
      function hideTip() { tip.classList.remove('on'); }

      /* =====================================================================
         Zoom y desplazamiento
      ===================================================================== */
      const view = { k: 1, x: 0, y: 0 };
      function applyView() {
        gViewport.setAttribute('transform', `translate(${view.x} ${view.y}) scale(${view.k})`);
      }
      function fit() {
        const r = svg.getBoundingClientRect();
        const k = Math.min(r.width / WORLD.w, r.height / WORLD.h) * 0.97;
        view.k = k;
        view.x = (r.width - WORLD.w * k) / 2;
        view.y = (r.height - WORLD.h * k) / 2;
        applyView();
      }
      function zoomAt(cx, cy, factor) {
        const k = clamp(view.k * factor, 0.18, 4);
        const f = k / view.k;
        view.x = cx - (cx - view.x) * f;
        view.y = cy - (cy - view.y) * f;
        view.k = k;
        applyView();

      svg.addEventListener('wheel', (ev) => {
        ev.preventDefault();
        const r = svg.getBoundingClientRect();
        zoomAt(ev.clientX - r.left, ev.clientY - r.top, ev.deltaY < 0 ? 1.12 : 1 / 1.12);
      }, { passive: false });

      let drag = null;
      svg.addEventListener('pointerdown', (ev) => {
        if (ev.target.closest('.node')) return;
        drag = { x: ev.clientX, y: ev.clientY, vx: view.x, vy: view.y, id: ev.pointerId };
        svg.setPointerCapture(ev.pointerId);
        svg.classList.add('dragging');
      });
      svg.addEventListener('pointermove', (ev) => {
        if (!drag || ev.pointerId !== drag.id) return;
        view.x = drag.vx + (ev.clientX - drag.x);
        view.y = drag.vy + (ev.clientY - drag.y);
        applyView();
      });
      const endDrag = (ev) => {
        if (drag && ev.pointerId === drag.id) { drag = null; svg.classList.remove('dragging'); }
      };
      svg.addEventListener('pointerup', endDrag);
      svg.addEventListener('pointercancel', endDrag);
      svg.addEventListener('click', (ev) => { if (!ev.target.closest('.node')) clearAll(); });

      document.getElementById('zoom-in').onclick = () => {
        const r = svg.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1.25);
      };
      document.getElementById('zoom-out').onclick = () => {
        const r = svg.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1 / 1.25);
      };
      document.getElementById('zoom-fit').onclick = fit;
      window.addEventListener('resize', () => { if (!drag) fit(); });

      function focusNode(id) {
        const n = byId.get(id);
        const r = svg.getBoundingClientRect();
        const k = Math.max(view.k, 0.75);
        view.k = k;
        view.x = r.width / 2 - (n.x + n.w / 2) * k;
        view.y = r.height / 2 - (n.y + n.h / 2) * k;
        applyView();

      /* =====================================================================
         Estado de resaltado
      ===================================================================== */
      let activeFlow = null;
      let selectedNode = null;
      const hiddenLayers = new Set();

      function resetClasses() {
        nodeEls.forEach((g) => g.classList.remove('dim', 'hit', 'selected', 'in-flow'));
        edgeEls.forEach(({ p }) => p.classList.remove('dim', 'lit'));
        gFlow.replaceChildren();
        gBadges.replaceChildren();

      function applyLayerFilter() {
        nodeEls.forEach((g, id) => {

      function clearAll() {
        activeFlow = null;
        selectedNode = null;
        resetClasses();
        applyLayerFilter();

        document.getElementById('search').value = '';

      /** Encuadra la vista sobre un conjunto de nodos: al elegir un flujo, la
       *  ruta se lee sin que el usuario tenga que buscarla por el diagrama. */
      function fitNodes(ids) {
        const ns = [...new Set(ids)].map((id) => byId.get(id));
        if (!ns.length) return;
        const box = {
          x1: Math.min(...ns.map((n) => n.x)) - 60,
          y1: Math.min(...ns.map((n) => n.y)) - 50,
          x2: Math.max(...ns.map((n) => n.x + n.w)) + 60,
          y2: Math.max(...ns.map((n) => n.y + n.h)) + 50,
        };
        const r = svg.getBoundingClientRect();
        const k = clamp(Math.min(r.width / (box.x2 - box.x1), r.height / (box.y2 - box.y1)), 0.2, 1.1);
        view.k = k;
        view.x = r.width / 2 - ((box.x1 + box.x2) / 2) * k;
        view.y = r.height / 2 - ((box.y1 + box.y2) / 2) * k;
        applyView();
      }

      /** `toggle:false` re-pinta el flujo activo sin apagarlo — lo necesitan la
       *  leyenda y la búsqueda, que solo quieren refrescar el resaltado.
       *  `refit:false` evita reencuadrar la vista en cada uno de esos refrescos. */
      function selectFlow(id, { toggle = true, refit = true } = {}) {
        if (toggle && activeFlow === id) { clearAll(); return; }
        activeFlow = id;
        selectedNode = null;
        resetClasses();

        const flow = DATA.flows.find((f) => f.id === id);
        const seq = flow.steps.map((s) => s.node);
        const inPath = new Set(seq);

        nodeEls.forEach((g, nid) => {
          if (inPath.has(nid)) { g.classList.add('hit', 'in-flow'); } else { g.classList.add('dim'); }
        });
        edgeEls.forEach(({ p }) => p.classList.add('dim'));

        for (let i = 0; i < seq.length - 1; i++) {
          const a = byId.get(seq[i]), b = byId.get(seq[i + 1]);
          if (a.id === b.id) continue;
          const color = layerById.get(b.layer).color;
          gFlow.appendChild(
            el('path', {
              d: pathFor(a, b), class: 'flow-path', stroke: color,
              'marker-end': `url(#arrow-flow-${b.layer})`,
              style: `animation-delay:${i * 0.07}s`,
            }),
          );
        }

        const stepsByNode = new Map();
        seq.forEach((nid, i) => {
          if (!stepsByNode.has(nid)) stepsByNode.set(nid, []);
          stepsByNode.get(nid).push(i + 1);
        });
        stepsByNode.forEach((idxs, nid) => {
          const n = byId.get(nid);
          const label = idxs.join('·');
          const rw = 15 + (label.length - 1) * 5;
          const g = el('g', { class: 'step-badge' });
          if (label.length > 1) {
            g.appendChild(el('rect', {
              x: n.x - rw / 2 + 4, y: n.y - 9, width: rw, height: 18, rx: 9,
              fill: layerById.get(n.layer).color, stroke: 'var(--bg-panel)', 'stroke-width': 2,
            }));
          } else {
            g.appendChild(el('circle', { cx: n.x + 4, cy: n.y, r: 9, fill: layerById.get(n.layer).color }));
          }
          const t = el('text', { x: n.x + 4, y: n.y + 3.5 });
          t.textContent = label;
          g.appendChild(t);
          gBadges.appendChild(g);
        });

        if (refit) fitNodes(seq);
        renderFlows();
        setTab('flows');
        document.getElementById('clear-btn').classList.add('on');
      }

      function selectNode(id) {
        selectedNode = id;
        activeFlow = null;
        resetClasses();

        const neighbors = new Set([id]);
        DATA.edges.forEach((e) => {
          if (e.from === id) neighbors.add(e.to);
          if (e.to === id) neighbors.add(e.from);
        });
        nodeEls.forEach((g, nid) => {
          if (neighbors.has(nid)) g.classList.add('hit'); else g.classList.add('dim');
        });
        nodeEls.get(id).classList.add('selected');
        edgeEls.forEach(({ e, p }) => {
          if (e.from === id || e.to === id) p.classList.add('lit'); else p.classList.add('dim');
        });

        renderFlows();
        renderNodePane();
        setTab('node');
        document.getElementById('clear-btn').classList.add('on');
      }

      /* =====================================================================
         Panel
      ===================================================================== */
      const paneFlows = document.getElementById('pane-flows');
      const paneNode = document.getElementById('pane-node');

      function renderFlows() {
        paneFlows.innerHTML = DATA.flows
          .map((f, i) => {
            const active = f.id === activeFlow;
            const steps = f.steps
              .map((s, j) => {
                const n = byId.get(s.node);
                const color = layerById.get(n.layer).color;
                return (
                  `<button class="step" data-node="${esc(s.node)}">` +
                  `<span class="step-i" style="background:${color}">${j + 1}</span>` +
                  `<span><span class="step-label">${esc(s.label)}</span><br>` +
                  `<span class="step-node">${esc(n.label)}</span><br>` +
                  `<span class="step-file">${esc(s.file)}</span></span></button>`
                );
              })
              .join('');
            return (
              `<div class="flow-card${active ? ' active' : ''}" data-flow="${esc(f.id)}">` +
              `<button class="flow-head"><span class="flow-num">${i + 1}</span><span>` +
              `<span class="flow-title">${esc(f.label)}</span>` +
              `<div class="flow-sum">${esc(f.summary)}</div>` +
              `<div class="flow-meta">${f.steps.length} pasos · ${
                new Set(f.steps.map((s) => byId.get(s.node).layer)).size
              } capas</div>` +
              `</span></button><div class="steps">${steps}</div></div>`
            );
          })
          .join('');

        paneFlows.querySelectorAll('.flow-head').forEach((b) => {
          b.onclick = () => selectFlow(b.closest('.flow-card').dataset.flow);
        });
        paneFlows.querySelectorAll('.step').forEach((b) => {
          b.onclick = () => focusNode(b.dataset.node);
        });
        const card = paneFlows.querySelector('.flow-card.active');
        if (card) card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }

      function renderNodePane() {
        if (!selectedNode) {
          paneNode.innerHTML =
            '<div class="empty">Elige un componente del diagrama para ver qué hace, ' +
            'con qué archivos y con quién habla.</div>';
          return;
        }
        const n = byId.get(selectedNode);
        const layer = layerById.get(n.layer);
        const out = DATA.edges.filter((e) => e.from === n.id);
        const inc = DATA.edges.filter((e) => e.to === n.id);
        const flows = DATA.flows.filter((f) => f.steps.some((s) => s.node === n.id));

        const chips = (list, dir) =>
          list.length
            ? `<div class="chips">${list
                .map((e) => {
                  const other = dir === 'out' ? e.to : e.from;
                  return `<button class="chip" data-node="${esc(other)}"><span class="arrow">${
                    dir === 'out' ? '→' : '←'
                  }</span>${esc(byId.get(other).label)}</button>`;
                })
                .join('')}</div>`
            : '<div class="empty" style="padding:6px 0;text-align:left">—</div>';

        paneNode.innerHTML =
          `<div class="detail-title"><span class="detail-dot" style="background:${layer.color}"></span>` +
          `<h2>${esc(n.label)}</h2></div>` +
          `<div class="detail-layer">${esc(layer.label)}</div>` +
          `<div class="detail-purpose">${esc(n.purpose)}</div>` +
          (n.files && n.files.length
            ? `<div class="detail-h">Archivos clave</div><div class="file-list">${n.files
                .map((f) => `<code>${esc(f)}</code>`)
                .join('')}</div>`
            : '') +
          `<div class="detail-h">Envía a (${out.length})</div>${chips(out, 'out')}` +
          `<div class="detail-h">Recibe de (${inc.length})</div>${chips(inc, 'in')}` +
          (flows.length
            ? `<div class="detail-h">Participa en ${flows.length} flujo${flows.length > 1 ? 's' : ''}</div>` +
              `<div class="chips">${flows
                .map((f) => `<button class="chip" data-flow="${esc(f.id)}">${esc(f.label)}</button>`)
                .join('')}</div>`
            : '');

        paneNode.querySelectorAll('.chip[data-node]').forEach((b) => {
          b.onclick = () => { selectNode(b.dataset.node); focusNode(b.dataset.node); };
        });
        paneNode.querySelectorAll('.chip[data-flow]').forEach((b) => {
          b.onclick = () => selectFlow(b.dataset.flow);
        });
      }

      function setTab(which) {
        const tf = document.getElementById('tab-flows'), tn = document.getElementById('tab-node');
        const isFlows = which === 'flows';
        tf.setAttribute('aria-selected', String(isFlows));
        tn.setAttribute('aria-selected', String(!isFlows));
        paneFlows.hidden = !isFlows;
        paneNode.hidden = isFlows;
      }
      document.getElementById('tab-flows').onclick = () => setTab('flows');
      document.getElementById('tab-node').onclick = () => setTab('node');
      document.getElementById('clear').onclick = clearAll;

      /* =====================================================================
         Leyenda, búsqueda, tema
      ===================================================================== */
      const legend = document.getElementById('legend');
      legend.innerHTML = DATA.meta.layers
        .map(
          (l) =>
            `<button data-layer="${l.id}" title="${esc(l.description)}">` +
            `<span class="swatch" style="background:${l.color}"></span>${esc(l.label)}</button>`,
        )
        .join('');
      legend.querySelectorAll('button').forEach((b) => {
        b.onclick = () => {
          const id = b.dataset.layer;
          if (hiddenLayers.has(id)) { hiddenLayers.delete(id); b.classList.remove('off'); }
          else { hiddenLayers.add(id); b.classList.add('off'); }
          if (activeFlow) selectFlow(activeFlow, { toggle: false, refit: false });
          else if (selectedNode) selectNode(selectedNode);
          else { resetClasses(); }
          applyLayerFilter();
        };
      });

      document.getElementById('search').addEventListener('input', (ev) => {
        const q = ev.target.value.trim().toLowerCase();
        if (!q) {
          resetClasses(); applyLayerFilter();
          if (activeFlow) selectFlow(activeFlow, { toggle: false, refit: false });
          else if (selectedNode) selectNode(selectedNode);
          return;
        }
        // Buscar descarta la selección previa. El panel tiene que enterarse:
        // si no, la tarjeta del flujo sigue pintada como activa mientras el
        // diagrama ya no resalta nada.
        const habiaSeleccion = activeFlow || selectedNode;
        activeFlow = null; selectedNode = null;
        if (habiaSeleccion) { renderFlows(); renderNodePane(); }
        resetClasses();
        let first = null;
        nodeEls.forEach((g, id) => {
          const n = byId.get(id);
          const hay = (n.label + ' ' + n.purpose + ' ' + (n.files || []).join(' ')).toLowerCase();
          if (hay.includes(q)) { g.classList.add('hit'); if (!first) first = id; }
          else g.classList.add('dim');
        });
        edgeEls.forEach(({ p }) => p.classList.add('dim'));
        if (first) focusNode(first);
      });

      const themeBtn = document.getElementById('theme-btn');
      themeBtn.onclick = () => {
        const cur = document.documentElement.dataset.theme;
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const next = cur === 'auto' ? (prefersDark ? 'light' : 'dark') : cur === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = next;
      };

      document.addEventListener('keydown', (ev) => {
        if (ev.key === 'Escape') { clearAll(); document.activeElement.blur(); }
        if (ev.key === '/' && document.activeElement.id !== 'search') {
          ev.preventDefault(); document.getElementById('search').focus();
        }
      });

      /* ===================================================================== */
      renderFlows();
      renderNodePane();
      fit();
    </script>
  </body>
</html>
