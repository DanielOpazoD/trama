<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: la app pinta hasta los bordes en iPhones con notch
         / home indicator; los elementos flotantes compensan con
         env(safe-area-inset-*) (var --safe-bottom en index.css). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- BB3/PERF1: preconnect + stylesheet directo a Google Fonts. Evitamos
         @import dentro de index.css para que el navegador descubra las fuentes
         durante el parseo de HTML y no después de bajar CSS principal. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&display=swap"
    />

    <!-- Favicons PNG generados desde el isotipo Trama sin wordmark. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <!-- PNG, no SVG: iOS ignora los SVG en apple-touch-icon (caería al
         screenshot genérico). Se regenera con scripts/generate-pwa-icons.mjs. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA manifest — habilita "Add to Home Screen" en iOS/Android con
         icono propio y modo standalone. -->
    <link rel="manifest" href="/manifest.json" />

    <!-- theme-color responsive — matchea paper-50 light y paper-50 dark.
         Algunos browsers solo respetan el primero, pero Chrome y Safari
         honran el media-query. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- Standalone web app — barra de status y nombre cuando se agrega
         a Home Screen. El "mobile-web-app-capable" es el estándar moderno
         (Chrome lo reconoce); el "apple-mobile-web-app-capable" se queda
         para que iOS Safari, que todavía no implementa el moderno, siga
         funcionando. Cuando iOS lo adopte, podemos retirar el apple-. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Trama" />

    <!-- SEO + descripción base -->
    <meta
      name="description"
      content="Trama — tu mapa cognitivo personal. Entidades, citas, relaciones, conexiones."
    />

    <!-- Open Graph — cuando se comparte el link en Twitter, Slack, etc. -->
    <meta property="og:title" content="Trama — mapa cognitivo personal" />
    <meta
      property="og:description"
      content="Hilo a hilo. Tu mapa de entidades, citas y relaciones, con la IA como copiloto silencioso."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card — imagen editorial con el isotipo nuevo. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Trama — mapa cognitivo personal" />
    <meta
      name="twitter:description"
      content="Hilo a hilo. Tu mapa de entidades, citas y relaciones."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <title>Trama — mapa cognitivo personal</title>
  </head>
  <body class="paper-grain">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
