[build]
  command = "npm run check:legacy-fallback && npm run build"
  publish = "dist"

[build.environment]
  # N1: eslint-plugin-jsx-a11y aún declara peers `eslint@^6 || ^7 || ^8`
  # pero nosotros usamos eslint@^9. El flag --legacy-peer-deps deja que
  # npm ci no falle en ese peer constraint. Sin esto el build de Netlify
  # rompe en "Install dependencies". Removerlo cuando jsx-a11y publique
  # una versión con peer eslint@^9 (hay PR upstream pendiente).
  NPM_FLAGS = "--legacy-peer-deps"

[functions]
  node_bundler = "esbuild"

[dev]
  framework = "vite"
  command = "npm run dev"
  targetPort = 5173

# N2: Security headers a nivel CDN para TODOS los assets/HTML servidos.
# Las APIs (/.netlify/functions/*) se ven afectadas por estos headers
# salvo que el handler los pise.
#
# CSP: empezamos restrictivo y abrimos solo lo necesario. Por directiva:
#   - script-src: 'self' + Clerk FAPI (*.clerk.accounts.dev, de donde se
#     carga clerk.browser.js) + challenges.cloudflare.com (Turnstile/anti-bot
#     de Clerk en sign-in/up). OJO: con llaves LIVE, el script de Clerk se
#     sirve desde https://clerk.<tu-dominio> — agregar ESE host acá al migrar.
#   - style-src: 'self' 'unsafe-inline' (Tailwind/Clerk inyectan inline) +
#     fonts.googleapis.com (las 3 familias se importan vía @import en index.css).
#   - font-src: 'self' data: + fonts.gstatic.com (binarios de Google Fonts).
#   - img-src: 'self' data: blob: + covers de Spotify (i/mosaic.scdn.co) +
#     img.clerk.com (avatares del UserButton).
#   - connect-src: /api propio + Spotify + Clerk (*.clerk.com,
#     *.clerk.accounts.dev) + clerk-telemetry.com.
#   - worker-src: 'self' blob: — Clerk usa web workers.
#   - media-src: 'self' blob: — notas de voz de momentos. AudioNote fetchea
#     /api/momentos-file/:key con auth de Clerk y arma un blob: URL para
#     <audio src>. Sin esta directiva, default-src 'self' bloquea el blob.
#   - frame-src: 'self' + challenges.cloudflare.com + *.clerk.accounts.dev.
#   - frame-ancestors 'none' / base-uri 'self' / form-action 'self' — hardening.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://*.clerk.accounts.dev https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://i.scdn.co https://mosaic.scdn.co https://img.clerk.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.spotify.com https://accounts.spotify.com https://*.clerk.com https://*.clerk.accounts.dev https://clerk.com https://clerk-telemetry.com; worker-src 'self' blob:; media-src 'self' blob:; frame-src 'self' https://challenges.cloudflare.com https://*.clerk.accounts.dev; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
